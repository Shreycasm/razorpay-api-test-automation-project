name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Run unit tests
        run: uv run pytest -m unit --cov=src/razorpay --cov-report=html --alluredir=reports/allure-results

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage

      - name: Upload unit Allure results
        uses: actions/upload-artifact@v4
        with:
          name: unit-allure-results
          path: reports/allure-results

  integration-tests:
    runs-on: ubuntu-latest
    env:
      RAZORPAY_API_KEY: ${{ secrets.RAZORPAY_API_KEY }}
      RAZORPAY_API_KEY_SECRET: ${{ secrets.RAZORPAY_API_KEY_SECRET }}
      BASE_URL: https://api.razorpay.com
      LOG_LEVEL: INFO
      INTEGRATION_POST_DELAY_SECONDS: 1.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Run integration tests
        run: uv run pytest -m integration -n 6 --alluredir=reports/allure-results

      - name: Upload integration Allure results
        uses: actions/upload-artifact@v4
        with:
          name: integration-allure-results
          path: reports/allure-results

  allure-report:
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
    if: always()

    steps:
      - name: Download unit Allure results
        uses: actions/download-artifact@v4
        with:
          name: unit-allure-results
          path: reports/allure-results

      - name: Download integration Allure results
        uses: actions/download-artifact@v4
        with: 
          name: integration-allure-results
          path: reports/allure-results

      - name: Install Allure CLI
        run: npm install -g allure

      - name: Generate Allure report
        run: allure generate reports/allure-results -o reports/allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report