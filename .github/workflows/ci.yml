name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Run unit tests
        run: uv run pytest -m unit

  integration-tests:
    runs-on: ubuntu-latest
    env:
      RAZORPAY_API_KEY: ${{ secrets.RAZORPAY_API_KEY }}
      RAZORPAY_API_KEY_SECRET: ${{ secrets.RAZORPAY_API_KEY_SECRET }}
      BASE_URL: https://api.razorpay.com
      LOG_LEVEL: INFO
      INTEGRATION_POST_DELAY_SECONDS: 1.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Run integration tests
        run: uv run pytest -m integration -n 6