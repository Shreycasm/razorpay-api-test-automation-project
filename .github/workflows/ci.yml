name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "30 3 * * 1"

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Run unit tests
        run: uv run pytest -m unit --cov=src/razorpay --cov-report=html --junitxml=reports/unit-results.xml --alluredir=reports/allure-results

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage

      - name: Upload unit Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-allure-results
          path: reports/allure-results

  integration-tests:
    runs-on: ubuntu-latest
    needs: lint
    env:
      RAZORPAY_API_KEY: ${{ secrets.RAZORPAY_API_KEY }}
      RAZORPAY_API_KEY_SECRET: ${{ secrets.RAZORPAY_API_KEY_SECRET }}
      BASE_URL: https://api.razorpay.com
      LOG_LEVEL: INFO
      INTEGRATION_POST_DELAY_SECONDS: 1.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Run integration tests
        run: uv run pytest -m integration -n 6 --junitxml=reports/integration-results.xml --alluredir=reports/allure-results

      - name: Upload integration Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-allure-results
          path: reports/allure-results

  allure-report:
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
    if: always()

    steps:
      - name: Download unit Allure results
        uses: actions/download-artifact@v4
        with:
          name: unit-allure-results
          path: reports/allure-results

      - name: Download integration Allure results
        uses: actions/download-artifact@v4
        with: 
          name: integration-allure-results
          path: reports/allure-results

      - name: Install Allure CLI
        run: |
          curl -o allure-2.46.1.tgz -OLs https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.46.1/allure-commandline-2.46.1.tgz
          tar -xzf allure-2.46.1.tgz
          echo "$PWD/allure-2.46.1/bin" >> "$GITHUB_PATH"

      - name: Generate Allure report
        run: allure generate reports/allure-results -o reports/allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report