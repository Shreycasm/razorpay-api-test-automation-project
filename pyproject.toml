[project]
name = "python-api-automation-project"
version = "0.1.0"
description = "A scalable API automation framework for Razorpay APIs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "structlog>=26.1.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/razorpay"]



# ────────────────────────── Pytest configuration ──────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
