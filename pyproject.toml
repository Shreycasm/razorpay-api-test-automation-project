[project]
name = "python-api-automation-project"
version = "0.1.0"
description = "A scalable API automation framework for Razorpay APIs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "allure-pytest>=2.16.0",
    "jsonschema>=4.26.0",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "requests>=2.34.2",
    "structlog>=26.1.0",
]


[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/razorpay"]



# ────────────────────────── Pytest configuration ──────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
strict_markers = true
markers = [
    "unit: Unit tests that do not make real API calls",
    "integration: Integration tests that make real API calls",
    "positive: Tests covering valid inputs and expected successful behavior",
    "negative: Tests covering invalid inputs and expected failure behavior",
]


# ────────────────────────── Coverage configuration ──────────────────────────
[tool.coverage.run]
source = ["src/razorpay"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "reports/coverage"
